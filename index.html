<style>
:root { color-scheme: light dark; --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --ring: rgba(11,11,11,0.18); --accent: #2a78d6; --bad: #d03b3b; }

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
main { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 24px 22px; }
h1 { font-size: 20px; margin: 0 0 6px; }
p { margin: 0 0 14px; color: var(--ink-2); }
label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
input { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--ring); background: var(--page); color: var(--ink); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { margin-top: 12px; font: inherit; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--ring); background: var(--surface); color: var(--ink); cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
#msg { margin: 12px 0 0; min-height: 1.4em; color: var(--bad); font-size: 13px; }
</style>

const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function unlock(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data));
  return new TextDecoder().decode(plain);
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const go = document.getElementById('go'), msg = document.getElementById('msg');
  go.disabled = true; msg.textContent = '';
  try {
    const html = await unlock(document.getElementById('pw').value);
    document.open(); document.write(html); document.close();
  } catch (err) {
    msg.textContent = 'That password did not work.';
    go.disabled = false;
  }
});
